name: Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Base API URL for DAST (optional)'
        required: false
        default: ''

jobs:
  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect stack
        id: detect
        run: |
          if [[ -f "composer.json" ]]; then echo "stack=php" >> $GITHUB_OUTPUT;
          elif [[ -f "package.json" ]]; then echo "stack=node" >> $GITHUB_OUTPUT;
          elif [[ -f "requirements.txt" ]]; then echo "stack=python" >> $GITHUB_OUTPUT;
          elif [[ -f "go.mod" ]]; then echo "stack=go" >> $GITHUB_OUTPUT;
          elif [[ -f "Gemfile" ]]; then echo "stack=ruby" >> $GITHUB_OUTPUT;
          else echo "stack=unknown" >> $GITHUB_OUTPUT; fi

  security-assessment:
    needs: detect-stack
    runs-on: ubuntu-latest
    env:
      STACK: ${{ needs.detect-stack.outputs.stack }}
      API_URL: ${{ github.event.inputs.api_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for scripts & reports)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (exceljs, semgrep, etc.)
        run: |
          npm install --save-dev semgrep exceljs artillery gitleaks trivy dependency-check zap-cli

      - name: Run SAST with Semgrep
        run: |
          semgrep scan --config=r2c --json --output=semgrep.json
        continue-on-error: true

      - name: Run Dependency Scan – Trivy Filesystem
        run: |
          trivy fs . --format json -o trivy.json
        continue-on-error: true

      - name: Run Gitleaks
        run: |
          gitleaks detect --format json -o gitleaks.json
        continue-on-error: true

      - name: Run OWASP Dependency‑Check (if Java/Node)
        run: |
          if [[ "$STACK" == "node" || "$STACK" == "java" ]]; then
            dependency-check --project MyRA --scan . --format JSON -o depcheck.json;
          fi
        continue-on-error: true

      - name: Run DAST with OWASP ZAP (passive)
        if: env.API_URL != ''
        run: |
          zap.sh -daemon -port 8090 -config api.disablekey=true &
          ZAP_PID=$!
          sleep 10
          zap-cli -p 8090 quickurl ${API_URL} -r zap-report.json
          kill $ZAP_PID
        continue-on-error: true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            semgrep.json
            trivy.json
            gitleaks.json
            depcheck.json
            zap-report.json
