name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd web-portal
          npm ci
          npm install selenium-webdriver mocha chai exceljs appium
          cd ..

  selenium-tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Selenium deps
        run: |
          cd web-portal
          npm ci
          cd ..
      - name: Run Selenium E2E tests
        run: |
          npm run e2e
        env:
          CI: true
      - name: Generate Selenium Excel report
        run: |
          npm run e2e:report
        env:
          CI: true
      - name: Upload Selenium Excel report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: selenium-tests/tests/test-summary.xlsx

  appium-tests:
    needs: setup
    runs-on: macos-latest # or ubuntu-latest with Android emulator
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Appium deps
        run: |
          cd web-portal
          npm ci
          cd ..
      - name: Start Appium server
        run: |
          npx appium --log-timestamp &
          echo "APPIUM_PID=$!" >> $GITHUB_ENV
      - name: Run Appium E2E tests
        run: |
          npm run e2e:appium
        env:
          CI: true
      - name: Generate Appium Excel report
        run: |
          npm run e2e:appium:report
        env:
          CI: true
      - name: Upload Appium Excel report
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-report
          path: appium-tests/tests/test-summary.xlsx

  load-test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Artillery
        run: npm install -g artillery
      - name: Run baseline load test
        run: |
          artillery run load-tests/baseline.yml --output load-report.json
      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-report.json
