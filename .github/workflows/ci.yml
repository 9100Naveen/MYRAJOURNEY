name: Test Automation & Report Generation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  master-test-report:
    name: Master Test Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: master-test-report
        run: npm install

      - name: Generate Master Test Report
        working-directory: master-test-report
        run: node generate-master-report.js

      - name: Upload Master Test Report
        uses: actions/upload-artifact@v4
        with:
          name: master-test-report
          path: master-test-report/master-test-report.xlsx
          retention-days: 14

  selenium-tests:
    name: Selenium Test Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: selenium-tests
        run: npm install

      - name: Start Web Portal Background Server
        working-directory: web-portal
        run: |
          npm install
          npm run dev -- --port 5175 &
        env:
          PORT: 5175

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5175

      - name: Run Physical Tests & Generate Reports
        working-directory: selenium-tests
        run: |
          node tests/generate-full-report.js
          node tests/run-physical-tests.js || true

      - name: Upload Selenium Reports
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: selenium-tests/tests/*.xlsx
          retention-days: 14

  test-suite:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Web Portal Background Server
        working-directory: web-portal
        run: |
          npm install
          npm run dev -- --port 5174 &
        env:
          PORT: 5174

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5174

      - name: Install dependencies
        working-directory: test-suite
        run: npm install

      - name: Run Autonomous Test Suite
        working-directory: test-suite
        run: node run-tests.js || true

      - name: Upload Test Suite Report
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-report
          path: test-suite/test_report.xlsx
          retention-days: 14
